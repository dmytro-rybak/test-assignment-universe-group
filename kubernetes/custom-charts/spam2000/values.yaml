replicaCount: 1

image:
  repository: andriiuni/spam2000
  tag: "1.1394.355"

# App listens on 3000 (hardcoded in the image)
containerPort: 3000

service:
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# VMServiceScrape for VictoriaMetrics operator.
vmServiceScrape:
  scrapeInterval: 15s
